server.port=${PORT:8080}

# ---- MySQL database ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodsider?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Impact estimate ----
app.impact.kg-per-serving=0.25

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Default admin account ----
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ---- Rewards ----
app.rewards.points-per-serving=1

# ---- Expiring soon threshold ----
app.listings.expiring-soon-minutes=60